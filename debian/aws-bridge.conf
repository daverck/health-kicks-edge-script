# ==============================================================================
# MOSQUITTO BRIDGE TO AWS IOT CORE
# ==============================================================================

connection aws-iot-bridge

# Replace with your AWS IoT Core ATS endpoint
address a2k10w7ebf2tx9-ats.iot.eu-north-1.amazonaws.com:8883

remote_clientid HK-1
local_clientid healthkicks-edge-local

start_type automatic

# TLS / Certificate Configuration
bridge_cafile /etc/mosquitto/certs/AmazonRootCA1.pem
bridge_certfile /etc/mosquitto/certs/device.pem.crt
bridge_keyfile /etc/mosquitto/certs/private.pem.key
bridge_insecure false

# Directives required for AWS IoT Core compatibility (v2.x)
bridge_protocol_version mqttv311
cleansession true
try_private false
notifications false
keepalive_interval 60

# Log verbosity (avoids log saturation from the telemetry/raw stream)
log_type error
log_type warning
log_type notice
log_type information

# ------------------------------------------------------------------------------
# TOPIC ROUTING
# Format: healthkicks/v1/{device_id}/...
# The default identifier is "HK-1". It is automatically configured during
# installation (postinst) from the EDGE_DEVICE_ID environment variable
# (e.g., export EDGE_DEVICE_ID="HK-1" before dpkg -i / apt install).
# ------------------------------------------------------------------------------

# 1. Telemetry (Local -> AWS)
topic healthkicks/v1/HK-1/telemetry/raw out 1

# 2. Haptic Commands (AWS -> Local)
topic healthkicks/v1/HK-1/commands/haptic in 1

# 3. Studio Commands (AWS -> Local)
topic healthkicks/v1/HK-1/commands/studio/start in 1

# 4. Fall Detection Events (Local -> AWS)
topic healthkicks/v1/HK-1/events/detection out 1

