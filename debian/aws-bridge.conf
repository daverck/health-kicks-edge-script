# ==============================================================================
# MOSQUITTO BRIDGE TO AWS IOT CORE
# ==============================================================================

connection aws-iot-bridge

# Remplacer par votre endpoint AWS IoT Core ATS
address <YOUR_AWS_ENDPOINT_ATS>.iot.eu-north-1.amazonaws.com:8883

remote_clientid healthkicks-edge
local_clientid healthkicks-edge-local

start_type automatic

# Configuration TLS / Certificats
bridge_cafile /etc/mosquitto/certs/AmazonRootCA1.pem
bridge_certfile /etc/mosquitto/certs/device.pem.crt
bridge_keyfile /etc/mosquitto/certs/private.pem.key
bridge_insecure false

# Directives requises pour la compatibilité AWS IoT Core (v2.x)
bridge_protocol_version mqttv311
cleansession true
try_private false
notifications false
keepalive_interval 60

# Verbosité des logs (évite la saturation par le flux telemetry/raw)
log_type error
log_type warning
log_type notice
log_type information

# ------------------------------------------------------------------------------
# ROUTAGE DES TOPICS
# ------------------------------------------------------------------------------

# 1. Télémétrie (Local -> AWS)
topic healthkicks/v1/healthkicks-pi-001/telemetry/raw out 1

# 2. Commandes haptiques (AWS -> Local)
topic healthkicks/v1/healthkicks-pi-001/commands/haptic in 1
