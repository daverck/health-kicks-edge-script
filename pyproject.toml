[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "healthkicks_edge"
version = "0.1.0"
description = "HealthKicks Raspberry Pi edge agent with local AI and MQTT"
requires-python = ">=3.10"
dependencies = [
    "joblib>=1.3,<2.0",
    "numpy>=1.24",
    "paho-mqtt>=2.0,<3.0",
    "pydantic>=2.0,<3.0",
    "pyserial>=3.5,<4.0",
    "scikit-learn>=1.3,<2.0",
]

[project.scripts]
healthkicks-edge = "healthkicks_edge.main:main"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning:joblib.*",
]